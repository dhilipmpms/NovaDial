name: Dependabot Build Report

on:
  workflow_run:
    workflows:
      - Dependabot Build Check
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    name: Comment on Dependabot PR
    if: github.event.workflow_run.conclusion != 'cancelled' && github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest

    steps:
      - name: Download PR number artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dependabot-pr-number
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Report build result
        uses: actions/github-script@v7
        env:
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          WORKFLOW_URL: ${{ github.event.workflow_run.html_url }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            function findPrNumber(dir) {
              if (!fs.existsSync(dir)) return null;
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              for (const entry of entries) {
                const fullPath = path.join(dir, entry.name);
                if (entry.isDirectory()) {
                  const nested = findPrNumber(fullPath);
                  if (nested) return nested;
                } else if (entry.name === 'pr-number.txt') {
                  const raw = fs.readFileSync(fullPath, 'utf8').trim();
                  if (/^\d+$/.test(raw)) return Number(raw);
                }
              }
              return null;
            }

            let prNumber = findPrNumber('report');

            // Fallback to workflow_run.pull_requests if artifact was not found
            if (!prNumber) {
              const run = context.payload.workflow_run;
              if (run?.pull_requests && run.pull_requests.length > 0) {
                prNumber = run.pull_requests[0].number;
              }
            }

            if (!prNumber) {
              core.warning('No PR number could be determined from artifact or workflow run; skipping report.');
              return;
            }

            core.info(`Processing report for PR #${prNumber}`);

            // Re-validate that the PR exists, targets main, and belongs to Dependabot
            let pr;
            try {
              const { data } = await github.rest.pulls.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber
              });
              pr = data;
            } catch (error) {
              core.setFailed(`Failed to fetch PR #${prNumber}: ${error.message}`);
              return;
            }

            const author = pr.user?.login;

            if (pr.base?.ref !== 'main') {
              core.setFailed(`PR #${prNumber} does not target main (targets '${pr.base?.ref}').`);
              return;
            }

            if (author !== 'dependabot[bot]' && author !== 'app/dependabot') {
              core.setFailed(`PR #${prNumber} is not authored by Dependabot (author: '${author}').`);
              return;
            }

            const conclusion = process.env.WORKFLOW_CONCLUSION;
            const passed = conclusion === 'success';

            const status = passed ? '✅ PASSED' : '❌ FAILED';
            const result = passed
              ? 'The release build completed successfully.'
              : 'The release build failed.';
            const advice = passed
              ? 'The build passed. Please review the dependency changes and test the affected functionality before merging.'
              : 'Do not merge until the failure has been investigated.';

            const workflowUrl = process.env.WORKFLOW_URL;

            const body = [
              '## 🤖 NovaDial Dependabot Build Report',
              '',
              `- Build status: ${status}`,
              '- Command: ./gradlew assembleCoreRelease',
              `- Result: ${result}`,
              `- Logs: [View build logs](${workflowUrl})`,
              '',
              advice,
              '',
              '*Note: This workflow does not merge PRs automatically.*'
            ].join('\n');

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            const reportHeader = '## 🤖 NovaDial Dependabot Build Report';
            const existingComment = comments.reverse().find(c => c.body && c.body.includes(reportHeader));

            if (existingComment) {
              core.info(`Updating existing comment (id: ${existingComment.id}) on PR #${prNumber}`);
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              core.info(`Creating comment on PR #${prNumber}`);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body
              });
            }
