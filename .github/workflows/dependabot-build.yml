name: Dependabot Build Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Dependabot PR number to build"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build NovaDial Core Release
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.actor == 'dependabot[bot]' ||
      github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.actor == 'app/dependabot' ||
      github.event.pull_request.user.login == 'app/dependabot'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Determine PR
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if ! [[ "$INPUT_PR" =~ ^[0-9]+$ ]]; then
              echo "Error: Invalid PR number '$INPUT_PR'. Must be a positive integer."
              exit 1
            fi
            echo "number=$INPUT_PR" >> "$GITHUB_OUTPUT"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$PR_AUTHOR" = "dependabot[bot]" ] || [ "$PR_AUTHOR" = "app/dependabot" ] || [ "$ACTOR" = "dependabot[bot]" ]; then
              echo "number=$EVENT_PR" >> "$GITHUB_OUTPUT"
            else
              echo "Error: This workflow only builds Dependabot PRs (PR author: '$PR_AUTHOR', actor: '$ACTOR')."
              exit 1
            fi
          else
            echo "Error: Unsupported event '$EVENT_NAME'."
            exit 1
          fi

      - name: Get PR details
        id: details
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr view "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --json number,headRefOid,headRefName,baseRefName,author \
            > pr.json

          cat pr.json

          BASE=$(jq -r '.baseRefName // empty' pr.json)
          AUTHOR=$(jq -r '.author.login // empty' pr.json)
          SHA=$(jq -r '.headRefOid // empty' pr.json)

          if [ "$BASE" != "main" ]; then
            echo "Error: PR must target main (targets '$BASE')."
            exit 1
          fi

          if [ "$AUTHOR" != "dependabot[bot]" ] && [ "$AUTHOR" != "app/dependabot" ]; then
            echo "Error: PR is not authored by Dependabot (author: '$AUTHOR')."
            exit 1
          fi

          if [ -z "$SHA" ]; then
            echo "Error: Could not determine PR head commit SHA."
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Save PR number artifact
        run: |
          mkdir -p pr
          echo "${{ steps.pr.outputs.number }}" > pr/pr-number.txt

      - name: Upload PR number artifact
        uses: actions/upload-artifact@v4
        with:
          name: dependabot-pr-number
          path: pr/pr-number.txt
          retention-days: 1

      - name: Checkout exact PR commit
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.details.outputs.sha }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build NovaDial
        run: ./gradlew assembleCoreRelease
