name: Dependabot Build Check

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

  workflow_dispatch:
    inputs:
      pr_number:
        description: "Dependabot PR number to build"
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  build:
    name: Build NovaDial Core Release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Determine PR
        id: pr
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          INPUT_PR: ${{ inputs.pr_number }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "number=$INPUT_PR" >> "$GITHUB_OUTPUT"
          elif [ "$ACTOR" = "dependabot[bot]" ]; then
            echo "number=$EVENT_PR" >> "$GITHUB_OUTPUT"
          else
            echo "This workflow only builds Dependabot PRs."
            exit 1
          fi

      - name: Get PR details
        id: details
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh pr view "$PR_NUMBER" \
            --repo "$REPOSITORY" \
            --json number,headRefOid,headRefName,baseRefName,author \
            > pr.json

          cat pr.json

          BASE=$(jq -r '.baseRefName' pr.json)
          AUTHOR=$(jq -r '.author.login' pr.json)
          SHA=$(jq -r '.headRefOid' pr.json)

          if [ "$BASE" != "main" ]; then
            echo "PR must target main."
            exit 1
          fi

          if [ "$AUTHOR" != "dependabot[bot]" ]; then
            echo "PR is not authored by Dependabot."
            exit 1
          fi

          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Checkout exact PR commit
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.details.outputs.sha }}
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build NovaDial
        run: ./gradlew assembleCoreRelease
